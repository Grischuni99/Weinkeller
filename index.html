<head>

<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ein Kellerbuch – schmale Spalte, Etikett-Fotos links, Flaschenzähler rechts, Details als Blatt von unten */
:root{
  --bg:#f5f4f2; --surface:#ffffff; --sunk:#ebe8e5;
  --fg:#1f1b1d; --muted:#6c6266; --line:#dcd6d3;
  --wine:#7a1f35; --wine-soft:#f3e3e7; --on-wine:#ffffff;
  --ok:#2f6b46; --ok-soft:#e2f0e7; --warn:#8a5a12; --warn-soft:#f6ecd8; --old:#6b5d63; --old-soft:#ece6e8;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161214; --surface:#211b1e; --sunk:#2b2427;
  --fg:#f1ecee; --muted:#a99ea3; --line:#3a3135;
  --wine:#d9718a; --wine-soft:#3a2129; --on-wine:#1a0d12;
  --ok:#7fc79a; --ok-soft:#1f3328; --warn:#e2b46a; --warn-soft:#3a2f1c; --old:#b8aab0; --old-soft:#30282c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161214; --surface:#211b1e; --sunk:#2b2427;
  --fg:#f1ecee; --muted:#a99ea3; --line:#3a3135;
  --wine:#d9718a; --wine-soft:#3a2129; --on-wine:#1a0d12;
  --ok:#7fc79a; --ok-soft:#1f3328; --warn:#e2b46a; --warn-soft:#3a2f1c; --old:#b8aab0; --old-soft:#30282c;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin:0;letter-spacing:-.01em}
.sub{font-family:var(--f-data);font-size:12px;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--wine);border-color:var(--wine);color:var(--on-wine)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--wine);border-color:var(--wine)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.head-actions{display:flex;gap:8px;flex-wrap:nowrap;justify-content:flex-end;align-items:center;flex:none}

.tools{display:flex;flex-direction:column;gap:10px;padding-block:14px 4px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

main{padding-block:10px 60px}
.list{display:flex;flex-direction:column;gap:0}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.thumb{width:56px;height:76px;border-radius:6px;background:var(--sunk);object-fit:cover;display:block;border:0;padding:0}
.thumb.empty{display:grid;place-items:center;color:var(--muted)}
.thumb.empty svg{width:22px;height:22px}
.row-main{min-width:0;text-align:left;background:none;border:0;padding:0}
.producer{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wname{font-family:var(--f-display);font-size:19px;font-weight:500;line-height:1.2;margin:2px 0 4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:baseline}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.old{background:var(--old-soft);color:var(--old)}
.counter{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.counter button{width:34px;height:34px;border:0;background:none;border-radius:50%;font-size:18px;line-height:1;color:var(--wine)}
.counter button:disabled{color:var(--muted);opacity:.5}
.counter output{min-width:26px;text-align:center;font-family:var(--f-data);font-weight:500;font-variant-numeric:tabular-nums}
.row.zero{opacity:.6}

.empty-state{padding:48px 0;text-align:center;color:var(--muted)}
.empty-state h2{font-family:var(--f-display);color:var(--fg);font-weight:500;font-size:22px;margin:0 0 6px}

/* Blatt */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:18px}
.detail-hero{display:grid;grid-template-columns:minmax(0,140px) 1fr;gap:18px;align-items:start}
.detail-hero img{width:100%;border-radius:8px;display:block}
.detail-hero .ph{aspect-ratio:3/4;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.detail-hero > div{min-width:0}
h2.big{font-family:var(--f-display);font-weight:500;font-size:27px;line-height:1.15;margin:4px 0 8px;text-wrap:balance}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:18px 0 0;font-size:14px}
.facts dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em;padding-top:2px}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.section{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.section h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.prof{display:grid;grid-template-columns:5.5em 1fr 5.5em;gap:6px 10px;align-items:center;font-size:13px}
.prof .r{text-align:right;color:var(--muted)}
.prof .l{color:var(--muted)}
.track{height:8px;border-radius:999px;background:var(--sunk);position:relative}
.track i{position:absolute;top:-3px;width:26px;height:14px;border-radius:999px;background:var(--wine);transform:translateX(-50%)}
.window{position:relative;height:30px;margin-top:4px}
.window .bar{position:absolute;top:10px;height:10px;border-radius:999px;background:var(--wine-soft);border:1px solid var(--wine)}
.window .now{position:absolute;top:2px;width:2px;height:26px;background:var(--fg)}
.window-scale{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:11px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--sunk);border-radius:999px;padding:4px 12px;font-size:13px}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;padding:2px;font-size:26px;line-height:1;color:var(--line)}
.stars button.on{color:var(--wine)}
.prose{max-width:65ch;margin:0}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}

/* Formular */
form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:15px;font-weight:400;color:var(--fg);width:100%}
label.f textarea{min-height:80px;resize:vertical}
input[type=range]{accent-color:var(--wine);padding:0!important;border:0!important;background:none!important}
.status{display:flex;gap:12px;align-items:center;background:var(--wine-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.status.err{background:var(--warn-soft);color:var(--warn)}
.spin{width:18px;height:18px;border:2px solid var(--wine);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.preview-img{max-height:220px;border-radius:8px;display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:40}
@media (max-width:460px){
  h1{font-size:24px}
  .head .btn .lbl{display:none}
  .grid3{grid-template-columns:1fr 1fr}
  .detail-hero{grid-template-columns:minmax(0,110px) 1fr}
  h2.big{font-size:23px}
}
</style>
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:34px}
.login p{color:var(--muted);margin:0}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:220px;z-index:8;display:flex;flex-direction:column}
.menu-pop button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px}
.menu-pop button:hover{background:var(--sunk)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px}
.sources{margin:8px 0 0;padding-left:18px;font-size:13px}
.pair-filter{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--muted)}
.pair-filter select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:8px 10px;font-size:14px;font-weight:500}
.tag-cat{border:1px solid var(--wine);background:var(--wine-soft);color:var(--wine);font-weight:600;cursor:pointer}
.views{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.views button{border:0;background:transparent;border-radius:9px;padding:9px 10px;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.views button span{font-family:var(--f-data);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--muted);border-radius:999px;padding:1px 8px}
.views button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.views button[aria-selected="true"] span{background:var(--wine-soft);color:var(--wine)}
.btn.buy{padding:8px 14px;font-size:13px;border-color:var(--wine);color:var(--wine);white-space:nowrap}
.wish-note{font-size:13px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.ext{background:var(--sunk);color:var(--fg)}
.facts a,.prose a{color:var(--wine)}
.pill.wish{background:var(--wine-soft);color:var(--wine)}
.wish-toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer}
.wish-toggle input{width:20px;height:20px;accent-color:var(--wine);margin:0}
fieldset.pair-pick{border:0;padding:0;margin:0;min-width:0}
fieldset.pair-pick legend{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;padding:0;margin-bottom:6px}
.chip-check{position:relative;display:inline-flex}
.chip-check input{position:absolute;opacity:0;pointer-events:none}
.chip-check span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--fg);cursor:pointer;user-select:none}
.chip-check input:checked + span{background:var(--wine);border-color:var(--wine);color:var(--on-wine)}
.chip-check input:focus-visible + span{outline:2px solid var(--wine);outline-offset:2px}
.sources a{color:var(--wine)}
</style>
</head>
<body>

<!-- Anmeldung -->
<section id="loginView" class="wrap" hidden>
  <form class="login" id="loginForm" novalidate>
    <h1>Mein Weinkeller</h1>
    <p id="loginHint">Melde dich an, um deinen Keller zu öffnen.</p>
    <label class="f">E-Mail<input id="l-email" type="email" autocomplete="username" required></label>
    <label class="f">Passwort<input id="l-pass" type="password" autocomplete="current-password" required minlength="8"></label>
    <div id="loginMsg"></div>
    <div class="actions" style="margin-top:0">
      <button class="btn primary" type="submit" id="btnLogin">Anmelden</button>
      <button class="btn ghost" type="button" id="btnSignup">Konto erstellen</button>
    </div>
  </form>
</section>

<!-- Einrichtung fehlt -->
<section id="setupView" class="wrap" hidden>
  <div class="login"><h1>Fast fertig</h1><p>In der Datei <code>config.js</code> fehlen noch die Supabase-Adresse und der anon-Key. Die Anleitung steht in der README.</p></div>
</section>

<!-- App -->
<div id="appView" hidden>
<header>
  <div class="wrap head">
    <div>
      <h1>Mein Weinkeller</h1>
      <div class="sub" id="stats">Keller wird geladen …</div>
    </div>
    <div class="head-actions">
      <button class="btn primary" id="btnPhoto" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Foto</span>
      </button>
      <div class="menu">
        <button class="icon-btn" id="btnMenu" type="button" aria-label="Menü" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
        <div class="menu-pop" id="menuPop" hidden>
          <button type="button" id="mManual">Wein von Hand erfassen</button>
          <button type="button" id="mExport">Backup herunterladen</button>
          <button type="button" id="mImport">Backup einlesen</button>
          <button type="button" id="mLogout">Abmelden</button>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
      <input type="file" id="importInput" accept="application/json,.json" hidden>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <div class="views" role="tablist" aria-label="Ansicht" id="views"></div>
    <input class="search" id="q" type="search" placeholder="Suchen: Weingut, Wein, Rebsorte, Region …" aria-label="Suchen">
    <div class="chips" id="chips"></div>
    <label class="pair-filter" for="pairSel"><span>Passt zu</span>
      <select id="pairSel"><option value="">alle Speisen</option></select>
    </label>
  </div>
  <div class="list" id="list"></div>
</main>
</div>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
const CFG = window.WEINKELLER_CONFIG || {};
const YEAR = new Date().getFullYear();
const BUCKET = "wine-photos";
const COLORS = {rot:{label:"Rot",c:"#7a1f35"},weiss:{label:"Weiss",c:"#d8c36a"},rose:{label:"Rosé",c:"#e597a6"},schaum:{label:"Schaumwein",c:"#b9c7a0"},suess:{label:"Süsswein",c:"#c98a2b"}};
const PROFILE = [["acidity","Weich","Säurehaltig"],["body","Leicht","Üppig"],["sweetness","Trocken","Süss"],["tannin","Sanft","Tanninhaltig"]];
const PAIRINGS = [
  ["Rotes Fleisch",              ["rotes fleisch","rind","beef","steak","entrec","lamm","lamb","hackbraten"]],
  ["Weisses Fleisch & Geflügel", ["weisses fleisch","kalb","schwein","geflügel","gefluegel","poulet","huhn","hähnchen","haehnchen","truthahn","pute","ente","perlhuhn"]],
  ["Wild",                       ["wild","reh","hirsch","gams","hase","fasan"]],
  ["Fisch",                      ["fisch","lachs","forelle","egli","zander","felchen","thun","dorade","kabeljau","saibling"]],
  ["Meeresfrüchte",              ["meeresfrücht","meeresfruecht","crevett","garnel","muschel","auster","hummer","scampi","calamar","tintenfisch"]],
  ["Käse",                       ["käse","kaese","raclette","fondue","gruy","parmesan","brie","comté","comte"]],
  ["Vegetarisch",                ["vegetar","vegan","gemüse","gemuese","pilz","risotto","spargel","kürbis","kuerbis","salat"]],
  ["Pasta & Pizza",              ["pasta","pizza","lasagne","spaghetti","nudel","ravioli","gnocchi"]],
  ["Asiatisch & scharf",         ["asiat","curry","sushi","thai","scharf","indisch","chinesisch"]],
  ["Apéro & Vorspeisen",         ["apéro","apero","aperitif","vorspeise","tapas","antipast","charcuterie","salami","wurst","trockenfleisch","rohschinken","schinken"]],
  ["Dessert",                    ["dessert","schokolade","kuchen","tarte","gebäck","gebaeck","früchte","fruechte","süssspeise"]]
];
const PAIR_NAMES = PAIRINGS.map(p=>p[0]);
function pairCats(w){
  // Sind Gruppen ausdrücklich gewählt, gelten nur diese; sonst aus Stichworten ableiten (alte Einträge, Erkennung)
  const explicit=(w.pairings||[]).filter(p=>PAIR_NAMES.includes(p));
  if(explicit.length) return PAIR_NAMES.filter(n=>explicit.includes(n));
  const out=new Set();
  (w.pairings||[]).forEach(item=>{
    const t=String(item).toLowerCase();
    PAIRINGS.forEach(([name,keys])=>{ if(t===name.toLowerCase() || keys.some(k=>t.includes(k))) out.add(name); });
  });
  return PAIR_NAMES.filter(n=>out.has(n));
}
let pairFilter="";
let view="keller";
try{ if(localStorage.getItem("wk-view")==="wunsch") view="wunsch"; }catch{}
const inView = w => !!w.wishlist === (view==="wunsch");
function setView(v){
  view=v; try{ localStorage.setItem("wk-view",v); }catch{}
  if(view==="wunsch" && filter==="vorrat") filter="alle";
  renderChips(); renderList();
}
const FIELDS = ["producer","name","vintage","color","grape","appellation","region","country","alcohol","volume","price","drinkFrom","drinkTo","description","notes","wishNote","extRating","extScale","extSource","extUrl"];
let loading=false, sb=null, user=null, wines=[], photoUrls={}, filter="alle", query="", loaded=false;
const pending = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseInt(v,10); return Number.isFinite(n) ? n : null; };
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; $("#toastRoot").replaceChildren(t); setTimeout(()=>t.remove(),3000); }
function show(view){ ["loginView","setupView","appView"].forEach(v=>$("#"+v).hidden = v!==view); }

/* ---------- Datenbank ---------- */
const toRow = w => ({
  producer:w.producer||"", name:w.name||"", vintage:w.vintage||"", color:w.color||"", grape:w.grape||"",
  appellation:w.appellation||"", region:w.region||"", country:w.country||"", alcohol:w.alcohol||"", volume:w.volume||"",
  price:w.price||"", drink_from:w.drinkFrom||"", drink_to:w.drinkTo||"", profile:w.profile||{}, pairings:w.pairings||[],
  description:w.description||"", source:w.source||"", notes:w.notes||"", rating:num(w.rating)||0,
  bottles:Math.max(0,num(w.bottles)||0), photo_path:w.photoPath||null,
  wishlist:!!w.wishlist, wish_note:w.wishNote||"",
  ext_rating:w.extRating||"", ext_rating_scale:w.extScale||"", ext_rating_source:w.extSource||"", ext_rating_count:w.extCount||"", ext_rating_url:w.extUrl||""
});
const fromRow = r => ({ id:r.id, producer:r.producer, name:r.name, vintage:r.vintage, color:r.color, grape:r.grape,
  appellation:r.appellation, region:r.region, country:r.country, alcohol:r.alcohol, volume:r.volume, price:r.price,
  drinkFrom:r.drink_from, drinkTo:r.drink_to, profile:r.profile||{}, pairings:r.pairings||[], description:r.description,
  source:r.source, notes:r.notes, rating:r.rating, bottles:r.bottles, photoPath:r.photo_path, createdAt:r.created_at, wishlist:!!r.wishlist, wishNote:r.wish_note||"",
  extRating:r.ext_rating||"", extScale:r.ext_rating_scale||"", extSource:r.ext_rating_source||"", extCount:r.ext_rating_count||"", extUrl:r.ext_rating_url||"" });

async function loadWines(){
  const {data,error} = await sb.from("wines").select("*");
  if(error){ $("#stats").textContent="Keller konnte nicht geladen werden"; toast("Laden fehlgeschlagen: "+error.message); return; }
  wines = data.map(fromRow); loaded=true;
  await refreshPhotoUrls();
  renderList();
}
async function refreshPhotoUrls(){
  const paths = wines.map(w=>w.photoPath).filter(p=>p && !photoUrls[p]);
  if(!paths.length) return;
  const {data} = await sb.storage.from(BUCKET).createSignedUrls(paths, 60*60*12);
  (data||[]).forEach(d=>{ if(d.signedUrl) photoUrls[d.path]=d.signedUrl; });
}
async function saveWine(w){
  const row = toRow(w);
  if(w.id){
    const {data,error}=await sb.from("wines").update(row).eq("id",w.id).select().single();
    if(error) throw error; return fromRow(data);
  }
  const {data,error}=await sb.from("wines").insert(row).select().single();
  if(error) throw error; return fromRow(data);
}
async function uploadPhoto(blob){
  const path = `${user.id}/${crypto.randomUUID()}.jpg`;
  const {error} = await sb.storage.from(BUCKET).upload(path, blob, {contentType:"image/jpeg"});
  if(error) throw error;
  const {data} = await sb.storage.from(BUCKET).createSignedUrl(path, 60*60*12);
  if(data?.signedUrl) photoUrls[path]=data.signedUrl;
  return path;
}

/* ---------- Bewertung aus dem Internet ---------- */
const fmtNum = v => String(v).replace(".",",");
function ratingText(w){
  if(!w.extRating) return "";
  const sc=String(w.extScale||"5");
  return sc==="5" ? `★ ${fmtNum(w.extRating)}` : `${fmtNum(w.extRating)}/${sc}`;
}
function ratingBadge(w){
  const t=ratingText(w); if(!t) return "";
  return `<span class="pill ext" title="Bewertung im Internet">${esc(t)}${w.extSource?` · ${esc(w.extSource.split(",")[0])}`:""}</span>`;
}
function ratingFromInfo(x){
  if(!x || x.value==null || x.value==="") return null;
  const count = x.count ? String(x.count).replace(/[^\d]/g,"") : "";
  return { extRating:String(x.value).replace(",","."), extScale:String(x.scale||"5"),
    extSource:(x.source||"")+(x.vintageOnly===false?", alle Jahrgänge":""), extCount:count, extUrl:/^https?:\/\//.test(x.url||"")?x.url:"" };
}
async function lookupRating(w, btn){
  btn.disabled=true; btn.textContent="Sucht im Internet …";
  try{
    const {data,error}=await sb.functions.invoke("analyze-label",{body:{mode:"rating", wine:{producer:w.producer,name:w.name,vintage:w.vintage,grape:w.grape,region:w.region,country:w.country}}});
    if(error){ let msg=error.message; try{ const j=await error.context?.json?.(); if(j?.error) msg=j.error; }catch{} throw new Error(msg); }
    if(data?.error) throw new Error(data.error);
    const r=ratingFromInfo(data?.extRating);
    if(!r){ toast("Keine verlässliche Bewertung im Internet gefunden."); btn.disabled=false; btn.textContent="Bewertung suchen"; return; }
    const row={ext_rating:r.extRating, ext_rating_scale:r.extScale, ext_rating_source:r.extSource, ext_rating_count:r.extCount, ext_rating_url:r.extUrl};
    const {error:e2}=await sb.from("wines").update(row).eq("id",w.id); if(e2) throw e2;
    Object.assign(w,r); renderList(); openDetail(w.id); toast("Bewertung ergänzt: "+ratingText(w)+(r.extSource?" · "+r.extSource:""));
  }catch(e){ toast("Suche fehlgeschlagen: "+(e.message||"bitte später nochmals versuchen")); btn.disabled=false; btn.textContent="Bewertung suchen"; }
}

function photoSrc(w){ return w.localPreview || (w.photoPath ? photoUrls[w.photoPath] : "") || ""; }
function windowStatus(w){
  const a=num(w.drinkFrom), b=num(w.drinkTo);
  if(!a && !b) return null;
  if(a && YEAR < a) return {cls:"warn", txt:"Lagern bis "+a};
  if(b && YEAR > b) return {cls:"old", txt:"Über dem Höhepunkt"};
  return {cls:"ok", txt:"Trinkreif"+(b?" bis "+b:"")};
}

function renderViews(){
  const k=wines.filter(w=>!w.wishlist).length, wl=wines.filter(w=>w.wishlist).length;

}
function renderChips(){
  const opts=[["alle","Alle"],...(view==="keller"?[["vorrat","Im Keller"]]:[]),...Object.entries(COLORS).map(([k,v])=>[k,v.label])];
  $("#chips").innerHTML = opts.map(([k,l])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");
}
function renderPairSelect(){
  const sel=$("#pairSel"); if(!sel) return;
  const counts={}; wines.filter(inView).forEach(w=>pairCats(w).forEach(c=>counts[c]=(counts[c]||0)+1));
  sel.innerHTML=`<option value="">alle Speisen</option>`+PAIR_NAMES.map(n=>`<option value="${esc(n)}" ${pairFilter===n?"selected":""}>${esc(n)} (${counts[n]||0})</option>`).join("");
  sel.value=pairFilter;
}
function renderStats(){
  if(!loaded) return;
  if(view==="wunsch"){ const n=wines.filter(w=>w.wishlist).length; $("#stats").textContent=`${n} ${n===1?"Wein":"Weine"} auf der Wunschliste`; return; }
  const cellar=wines.filter(w=>!w.wishlist);
  const bottles = cellar.reduce((s,w)=>s+(num(w.bottles)||0),0);
  const ready = cellar.filter(w=>(num(w.bottles)||0)>0 && windowStatus(w)?.cls==="ok").length;
  $("#stats").textContent = `${bottles} ${bottles===1?"Flasche":"Flaschen"} · ${cellar.length} ${cellar.length===1?"Wein":"Weine"} · ${ready} trinkreif`;
}
function matches(w){
  if(!inView(w)) return false;
  if(filter==="vorrat" && !(num(w.bottles)>0)) return false;
  if(COLORS[filter] && w.color!==filter) return false;
  if(pairFilter && !pairCats(w).includes(pairFilter)) return false;
  if(!query) return true;
  const hay=[w.producer,w.name,w.grape,w.region,w.country,w.appellation,w.vintage,...(w.pairings||[]),w.wishNote].join(" ").toLowerCase();
  return query.toLowerCase().split(/\s+/).every(t=>hay.includes(t));
}
const emptyWish = `<div class="empty-state"><h2>Deine Wunschliste ist leer</h2><p>Hat dir ein Wein bei Freunden oder im Restaurant geschmeckt? Tippe auf <strong>Foto</strong> und fotografiere das Etikett. Er landet dann hier, bis du ihn kaufst.</p></div>`;
const emptyHtml = `<div class="empty-state"><h2>Dein Keller ist noch leer</h2><p>Tippe auf <strong>Foto</strong> und fotografiere ein Etikett. Die Angaben werden danach automatisch ergänzt.<br>Oder lies im Menü ein Backup ein.</p></div>`;
function renderList(){
  renderStats(); renderPairSelect(); if(loaded) renderViews();
  if(!loaded) return;
  const items = wines.filter(matches).sort((a,b)=>(a.producer||"").localeCompare(b.producer||"","de")||(a.name||"").localeCompare(b.name||"","de")||(num(a.vintage)||0)-(num(b.vintage)||0));

      <button class="row-main" data-open="${esc(w.id)}">

        ${wish&&w.wishNote?`<div class="wish-note">${esc(w.wishNote)}</div>`:""}
      </button>
      ${wish?`<button class="btn buy" type="button" data-buy="${esc(w.id)}">Gekauft</button>`:`<div class="counter" aria-label="Flaschen">
        <button type="button" data-dec="${esc(w.id)}" ${n?"":"disabled"} aria-label="Eine Flasche weniger">−</button>
        <output>${n}</output>
        <button type="button" data-inc="${esc(w.id)}" aria-label="Eine Flasche mehr">+</button>
      </div>`}</div>`;
  }).join("");
}
function setBottles(id, n){
  const w=wines.find(x=>x.id===id); if(!w) return;
  w.bottles=Math.max(0,n); renderList();
  pending[id]=(pending[id]||Promise.resolve()).then(async()=>{
    const {error}=await sb.from("wines").update({bottles:w.bottles}).eq("id",id); if(error) throw error;
  }).catch(()=>toast("Speichern fehlgeschlagen. Bitte Internetverbindung prüfen."));

/* ---------- Details ---------- */
function closeSheet(){ $("#sheetRoot").innerHTML=""; }
function openSheet(html){
  $("#sheetRoot").innerHTML=`<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#sheetBg").addEventListener("click",e=>{ if(e.target.id==="sheetBg") closeSheet(); });
}
function profileHtml(p){
  if(!p || !PROFILE.some(([k])=>p[k])) return "";
  return `<div class="section"><h3>Geschmacksprofil</h3><div class="prof">${PROFILE.map(([k,l,r])=>{
    if(!p[k]) return ""; const v=Math.min(5,Math.max(1,Number(p[k])));
    return `<span class="l">${l}</span><span class="track"><i style="left:calc(13px + (100% - 26px) * ${(v-1)/4})"></i></span><span class="r">${r}</span>`;}).join("")}</div></div>`;
}
function windowHtml(w){
  const a=num(w.drinkFrom), b=num(w.drinkTo); if(!a||!b||b<a) return "";
  const lo=Math.min(a,YEAR,num(w.vintage)||a)-1, hi=Math.max(b,YEAR)+1, span=hi-lo;
  const pos=y=>((y-lo)/span*100).toFixed(2)+"%";
  const st=windowStatus(w);
  return `<div class="section"><h3>Trinkfenster ${a} – ${b} ${st?`<span class="pill ${st.cls}" style="margin-left:6px;text-transform:none;letter-spacing:0">${st.txt}</span>`:""}</h3>
    <div class="window"><div class="bar" style="left:${pos(a)};width:calc(${pos(b)} - ${pos(a)})"></div><div class="now" style="left:${pos(YEAR)}" title="Heute"></div></div>
    <div class="window-scale"><span>${lo}</span><span>heute ${YEAR}</span><span>${hi}</span></div></div>`;
}
function sourcesHtml(src){
  // source: Text, optional gefolgt von Zeilen "Titel | URL"
  if(!src) return "";
  const lines=src.split("\n"), head=lines.shift();
  const links=lines.map(l=>l.split(" | ")).filter(([,u])=>/^https?:\/\//.test(u||""));
  return `<p class="note">${esc(head)}</p>${links.length?`<ul class="sources">${links.map(([t,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t||u)}</a></li>`).join("")}</ul>`:""}`;
}

    <fieldset class="f pair-pick"><legend>Passt zu</legend>
      <div class="chips">${PAIR_NAMES.map((n,i)=>`<label class="chip-check"><input type="checkbox" id="f-pc-${i}" name="pc" value="${esc(n)}" ${pairCats(w).includes(n)?"checked":""}><span>${esc(n)}</span></label>`).join("")}</div>
      <label class="f" style="margin-top:8px">Genauer (optional, mit Komma trennen)<input id="f-pairings" name="pairings" placeholder="z. B. Kalbsgeschnetzeltes, Raclette" value="${esc((w.pairings||[]).filter(p=>!PAIR_NAMES.includes(p)).join(", "))}"></label>
    </fieldset>
    <label class="f">Über den Wein<textarea id="f-description" name="description">${v("description")}</textarea></label>
    <label class="f">Meine Notizen<textarea id="f-notes" name="notes">${v("notes")}</textarea></label>
    <div class="actions" style="margin-top:4px"><button class="btn primary" type="submit" id="btnSave">Im Keller speichern</button><button class="btn ghost" type="button" data-close>Abbrechen</button></div>
  </form>`;
}
function readForm(){
  const f=$("#wineForm"), g=n=>f.elements[n]?.value.trim()||"", out={};
  FIELDS.forEach(k=>out[k]=g(k));
  out.bottles=Math.max(0,num(g("bottles"))||0);
  out.wishlist=!!f.elements.wishlist?.checked;
  out.extRating=out.extRating.replace(",",".");
  if(!out.extRating){ out.extSource=""; out.extUrl=""; }
  const cats=[...f.querySelectorAll('input[name="pc"]:checked')].map(i=>i.value);
  out.pairings=[...cats, ...g("pairings").split(",").map(s=>s.trim()).filter(s=>s && !PAIR_NAMES.includes(s))];
  out.profile={}; PROFILE.forEach(([k])=>{const n=Number(g("p-"+k)); if(n>0) out.profile[k]=n;});
  return out;
}
function openForm(w, busy){
  draft={...w};
  openSheet(formHtml(draft, busy));
  $("#f-wishlist").addEventListener("change",e=>{ $("#wishNoteWrap").hidden=!e.target.checked; const b=$("#f-bottles"); if(e.target.checked && b.value==="1") b.value="0"; else if(!e.target.checked && b.value==="0") b.value="1"; });
  $("#wineForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const data={...draft, ...readForm()};
    if(!data.producer && !data.name){ toast("Bitte mindestens Weingut oder Wein angeben."); return; }
    $("#btnSave").disabled=true; $("#btnSave").textContent="Speichern …";
    try{
      if(draft.photoBlob && !draft.photoPath){ data.photoPath = await uploadPhoto(draft.photoBlob); }
      delete data.photoBlob; delete data.localPreview;
      const saved = await saveWine(data);
      const i = wines.findIndex(x=>x.id===saved.id); if(i>=0) wines[i]=saved; else wines.push(saved);
      closeSheet(); if(!!saved.wishlist!==(view==="wunsch")) setView(saved.wishlist?"wunsch":"keller"); else renderList();
      toast(draft.id?"Gespeichert":(saved.wishlist?"Auf die Wunschliste gesetzt":"Im Keller gespeichert"));
    }catch(err){ $("#btnSave").disabled=false; $("#btnSave").textContent="Im Keller speichern"; toast("Speichern fehlgeschlagen: "+(err.message||"bitte nochmals versuchen")); }
  });
}
function fillForm(info){
  const f=$("#wineForm"); if(!f) return;
  const set=(n,v)=>{ const el=f.elements[n]; if(el && v!=null && v!=="" && !el.value) el.value=v; };
  ["producer","name","vintage","grape","appellation","region","country","alcohol","volume","price","drinkFrom","drinkTo","description"].forEach(k=>set(k,info[k]!=null?String(info[k]):""));
  if(info.color && COLORS[info.color] && !f.elements.color.value) f.elements.color.value=info.color;
  const rt=ratingFromInfo(info.extRating);
  if(rt && !f.elements.extRating.value){ f.elements.extRating.value=rt.extRating; f.elements.extScale.value=["5","20","100"].includes(rt.extScale)?rt.extScale:"5"; f.elements.extSource.value=rt.extSource; f.elements.extUrl.value=rt.extUrl; draft.extCount=rt.extCount; }
  if(Array.isArray(info.pairings) && info.pairings.length){
    const cats=pairCats({pairings:info.pairings});
    f.querySelectorAll('input[name="pc"]').forEach(i=>{ if(cats.includes(i.value)) i.checked=true; });
    if(!f.elements.pairings.value) f.elements.pairings.value=info.pairings.filter(p=>!PAIR_NAMES.includes(p)).join(", ");
  }
  PROFILE.forEach(([k])=>{ const el=f.elements["p-"+k]; const n=Number(info.profile?.[k]); if(el && Number(el.value)===0 && n>=1 && n<=5) el.value=Math.round(n); });
}

/* ---------- Foto & Erkennung ---------- */
function resize(file, max, q){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("resize")),"image/jpeg",q); };
    img.onerror=()=>{URL.revokeObjectURL(url); rej(new Error("load"));};
    img.src=url;
  });
}
const blobToBase64 = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(b); });
const blobToDataUrl = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result)); r.onerror=rej; r.readAsDataURL(b); });

async function handlePhoto(file){
  let blob; try{ blob=await resize(file,1400,.85); }catch{ blob=file; }
  const preview = URL.createObjectURL(blob);
  openForm({...newDefaults(), photoBlob:blob, localPreview:preview},
    `<div class="status"><span class="spin"></span><span>Etikett wird gelesen und im Internet nachgeschlagen. Das dauert etwa 20–40 Sekunden …</span></div>`);
  const status=t=>{ const s=$("#aiStatus"); if(s) s.innerHTML=t; };
  try{
    const small = blob.size>3_500_000 ? await resize(file,1000,.75) : blob;
    const {data,error} = await sb.functions.invoke("analyze-label",{body:{image:await blobToBase64(small), mediaType:"image/jpeg"}});
    if(error){ let msg=error.message; try{ const j=await error.context?.json?.(); if(j?.error) msg=j.error; }catch{} throw new Error(msg); }
    if(data?.error) throw new Error(data.error);
    fillForm(data||{});
    const links=(data?.sources||[]).filter(s=>s?.url).slice(0,5).map(s=>`${(s.title||"").replace(/\|/g,"-")} | ${s.url}`);
    draft.source=["Vom Etikett gelesen und im Internet ergänzt"+(data?.confidence?` (Sicherheit: ${data.confidence})`:"")+".",...links].join("\n");
    if(data?.labelReadable===false){
      draft.source="";
      status(`<div class="status err">Auf dem Foto ist kein lesbares Etikett zu erkennen. Mach am besten ein schärferes Foto von vorne, ohne Spiegelung, oder trage die Angaben von Hand ein. Das Foto wird trotzdem gespeichert.</div>`);
    } else if(data?.foundOnline===false){
      draft.source="Nur vom Etikett gelesen, im Internet nicht gefunden.";
      status(`<div class="status err">Diesen Wein habe ich im Internet nicht gefunden. Übernommen sind nur die Angaben vom Etikett. Ergänze den Rest bei Bedarf von Hand; du kannst das später auch jederzeit nachholen.</div>`);
    } else {
      status(`<div class="status"><span>Angaben ergänzt${data?.confidence?` · Sicherheit ${esc(data.confidence)}`:""}. Bitte kurz prüfen und speichern.</span></div>`);
    }
  }catch(e){
    status(`<div class="status err">Das Etikett konnte nicht automatisch ausgewertet werden (${esc(e.message||"unbekannter Fehler")}). Du kannst die Angaben von Hand eintragen; das Foto wird trotzdem gespeichert.</div>`);
  }
}

/* ---------- Backup ---------- */
async function exportBackup(){
  toast("Backup wird erstellt …");
  const out=[];
  for(const w of wines){
    const item={...w}; delete item.id; delete item.photoPath; delete item.createdAt;
    if(w.photoPath){ const {data}=await sb.storage.from(BUCKET).download(w.photoPath); if(data) item.photo=await blobToDataUrl(data); }
    out.push(item);
  }
  const blob=new Blob([JSON.stringify({app:"weinkeller",version:1,exported:new Date().toISOString(),wines:out})],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`weinkeller-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
async function importBackup(file){
  let j; try{ j=JSON.parse(await file.text()); }catch{ toast("Diese Datei ist kein Weinkeller-Backup."); return; }
  const list=Array.isArray(j?.wines)?j.wines:[]; if(!list.length){ toast("Im Backup sind keine Weine."); return; }
  const key=w=>[w.producer,w.name,w.vintage].map(s=>String(s||"").toLowerCase().trim()).join("|");
  const have=new Set(wines.map(key)); let added=0, skipped=0;
  toast(`${list.length} Weine werden eingelesen …`);
  for(const item of list){
    if(have.has(key(item))){ skipped++; continue; }
    const w={...item}; delete w.photo;
    try{
      if(item.photo?.startsWith("data:image")){ const b=await (await fetch(item.photo)).blob(); w.photoPath=await uploadPhoto(b); }
      wines.push(await saveWine(w)); added++;
    }catch(e){ toast("Fehler beim Einlesen: "+e.message); }
  }
  renderList(); toast(`${added} Weine eingelesen`+(skipped?`, ${skipped} schon vorhanden`:""));
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");
  if(!e.target.closest(".menu")) $("#menuPop").hidden=true;
  if(!t) return;
  if(t.dataset.f){ filter=t.dataset.f; renderChips(); renderList(); return; }
  if(t.dataset.view){ setView(t.dataset.view); return; }
  if(t.dataset.buy||t.dataset.towish){
    const id=t.dataset.buy||t.dataset.towish, w=wines.find(x=>x.id===id); if(!w) return;
    const patch = t.dataset.buy ? {wishlist:false, bottles:Math.max(1,num(w.bottles)||0)} : {wishlist:true};
    sb.from("wines").update(patch).eq("id",id).then(({error})=>{
      if(error){ toast("Speichern fehlgeschlagen. Bitte nochmals versuchen."); return; }
      Object.assign(w, patch); closeSheet(); renderList();
      toast(t.dataset.buy ? `In den Keller verschoben (${w.bottles} ${w.bottles===1?"Flasche":"Flaschen"}). Anzahl im Keller mit + anpassen.` : "Auf die Wunschliste gesetzt");
    }); return; }
  if(t.dataset.pair){ pairFilter=t.dataset.pair; closeSheet(); renderList(); window.scrollTo({top:0,behavior:"smooth"}); toast("Gefiltert: passt zu "+pairFilter); return; }
  if(t.dataset.inc||t.dataset.dec){ const id=t.dataset.inc||t.dataset.dec; const w=wines.find(x=>x.id===id); setBottles(id,(num(w.bottles)||0)+(t.dataset.inc?1:-1)); if($(".sheet")&&!$("#wineForm")) openDetail(id); return; }
  if(t.dataset.open){ openDetail(t.dataset.open); return; }
  if(t.dataset.edit){ const w=wines.find(x=>x.id===t.dataset.edit); openForm({...w}); return; }
  if(t.dataset.del){ const id=t.dataset.del, w=wines.find(x=>x.id===id);
    sb.from("wines").delete().eq("id",id).then(async({error})=>{ if(error){toast("Entfernen fehlgeschlagen.");return;}
      if(w?.photoPath) await sb.storage.from(BUCKET).remove([w.photoPath]);
      wines=wines.filter(x=>x.id!==id); closeSheet(); renderList(); toast("Wein entfernt"); }); return; }
  if("close" in t.dataset){ closeSheet(); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
$("#q").addEventListener("input",e=>{ query=e.target.value.trim(); renderList(); });
$("#pairSel").addEventListener("change",e=>{ pairFilter=e.target.value; renderList(); });
$("#btnPhoto").onclick=()=>$("#fileInput").click();
$("#btnMenu").onclick=()=>{ const p=$("#menuPop"); p.hidden=!p.hidden; $("#btnMenu").setAttribute("aria-expanded",String(!p.hidden)); };
$("#mManual").onclick=()=>{ $("#menuPop").hidden=true; openForm(newDefaults()); };
$("#mExport").onclick=()=>{ $("#menuPop").hidden=true; exportBackup(); };
$("#mImport").onclick=()=>{ $("#menuPop").hidden=true; $("#importInput").click(); };
$("#mLogout").onclick=async()=>{ $("#menuPop").hidden=true; await sb.auth.signOut(); };
$("#fileInput").addEventListener("change",e=>{ const f=e.target.files?.[0]; e.target.value=""; if(f) handlePhoto(f); });
$("#importInput").addEventListener("change",e=>{ const f=e.target.files?.[0]; e.target.value=""; if(f) importBackup(f); });

/* ---------- Anmeldung ---------- */
async function auth(kind){
  const email=$("#l-email").value.trim(), password=$("#l-pass").value;
  const msg=t=>$("#loginMsg").innerHTML=t?`<div class="status err">${esc(t)}</div>`:"";
  if(!email || password.length<8){ msg("Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben."); return; }
  msg("");
  const {data,error} = kind==="signup" ? await sb.auth.signUp({email,password}) : await sb.auth.signInWithPassword({email,password});
  if(error){ msg(error.message==="Invalid login credentials"?"E-Mail oder Passwort ist falsch.":error.message); return; }
  if(kind==="signup" && !data.session){ $("#loginMsg").innerHTML=`<div class="status">Konto erstellt. Bitte bestätige den Link in der E-Mail, dann hier anmelden.</div>`; }
}
$("#loginForm").addEventListener("submit",e=>{ e.preventDefault(); auth("login"); });
$("#btnSignup").onclick=()=>auth("signup");

function onSession(session){
  user=session?.user||null;
  if(!user){ show("loginView"); wines=[]; loaded=false; photoUrls={}; return; }
  show("appView"); renderChips();
  if(!loaded && !loading){ loading=true; loadWines().finally(()=>loading=false); }
}

if(!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase){ show("setupView"); return; }
sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
sb.auth.onAuthStateChange((_ev, session)=>onSession(session));
sb.auth.getSession().then(({data})=>onSession(data.session));
navigator.storage?.persist?.().catch(()=>{});
})();
</script>
